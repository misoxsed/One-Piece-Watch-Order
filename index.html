      // Realtime Firestore Listener when in a Shared Room
      useEffect(() => {
        if (!activeRoom || !window.db || !window.auth?.currentUser) return;
        setIsSyncing(true);

        const docRef = window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rooms', activeRoom);
        const unsubscribe = window.onSnapshot(docRef, (snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.data();
            if (data && data.checkedItems) {
              setCheckedItems(data.checkedItems);
            }
          } else {
            // Create initial room state if it doesn't exist
            window.setDoc(docRef, { checkedItems, updatedAt: Date.now() });
          }
          setIsSyncing(false);
        }, (error) => {
          console.error("Firestore sync error:", error);
          setIsSyncing(false);
        });

        return () => unsubscribe();
      }, [activeRoom]);

      // Save to localStorage (Local mode) or sync to Firestore (Room mode)
      const updateCheckedState = (newChecked) => {
        setCheckedItems(newChecked);
        try {
          localStorage.setItem('onepiece_watch_order_ep500', JSON.stringify(newChecked));
        } catch (e) {}

        if (activeRoom && window.db && window.auth?.currentUser) {
          const docRef = window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rooms', activeRoom);
          window.setDoc(docRef, { checkedItems: newChecked, updatedAt: Date.now() }, { merge: true });
        }
      };

      // Create or Join Room
      const joinRoom = (targetRoom) => {
        const cleanRoom = (targetRoom || roomId).trim().toUpperCase();
        if (!cleanRoom) return;
        setActiveRoom(cleanRoom);
        // Update URL query string without reloading page
        const newUrl = new URL(window.location.href);
        newUrl.searchParams.set('room', cleanRoom);
        window.history.pushState({}, '', newUrl);
        setShowShareModal(false);
      };

      const leaveRoom = () => {
        setActiveRoom('');
        const newUrl = new URL(window.location.href);
        newUrl.searchParams.delete('room');
        window.history.pushState({}, '', newUrl);
      };

      const createNewRoom = () => {
        const newCode = Math.random().toString(36).substring(2, 8).toUpperCase();
        joinRoom(newCode);
      };

      const copyShareLink = () => {
        const shareUrl = window.location.href;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(shareUrl);
        } else {
          const input = document.createElement('input');
          input.value = shareUrl;
          document.body.appendChild(input);
          input.select();
          document.execCommand('copy');
          document.body.removeChild(input);
        }
        setCopied(true);
        setTimeout(() => setCopied(false), 2500);
      };

      // Toggle dark mode class on body
      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      // Total item calculations
      const allItems = useMemo(() => CHECKLIST_DATA.flatMap(saga => saga.items), []);
      const totalCount = allItems.length;
      const completedCount = useMemo(() => allItems.filter(item => checkedItems[item.id]).length, [allItems, checkedItems]);
      const percentCompleted = totalCount === 0 ? 0 : Math.round((completedCount / totalCount) * 100);

      const toggleItem = (id) => {
        const updated = { ...checkedItems, [id]: !checkedItems[id] };
        updateCheckedState(updated);
      };

      // Select All / Deselect All
      const toggleAll = (selectState) => {
        const newChecked = {};
        allItems.forEach(item => {
          newChecked[item.id] = selectState;
        });
        updateCheckedState(newChecked);
      };

      // Helper badge renderer
      const getTypeTag = (type, badgeTag) => {
        if (badgeTag) {
          return <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-500/20 text-amber-700 dark:text-amber-300 border border-amber-500/30 uppercase tracking-wider">{badgeTag}</span>;
        }
        switch (type) {
          case 'movie':
            return <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-red-500/20 text-red-700 dark:text-red-400 border border-red-500/30 uppercase tracking-wider">MOVIE</span>;
          case 'special':
            return <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-purple-500/20 text-purple-700 dark:text-purple-300 border border-purple-500/30 uppercase tracking-wider">SPECIAL / OVA</span>;
          case 'cover':
            return <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-700 dark:text-emerald-400 border border-emerald-500/30 uppercase tracking-wider">MANGA COVER STORY</span>;
          default:
            return <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-blue-500/20 text-blue-700 dark:text-blue-400 border border-blue-500/30 uppercase tracking-wider">CANON EPISODES</span>;
        }
      };

      // Filtered data based on search and selected category
      const filteredSagas = useMemo(() => {
        return CHECKLIST_DATA.map(saga => {
          const matchingItems = saga.items.filter(item => {
            const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                  (item.note && item.note.toLowerCase().includes(searchQuery.toLowerCase()));
            
            let matchesFilter = true;
            if (filter === 'completed') matchesFilter = !!checkedItems[item.id];
            if (filter === 'remaining') matchesFilter = !checkedItems[item.id];
            if (filter === 'movies') matchesFilter = item.type === 'movie' || item.type === 'special';
            if (filter === 'cover') matchesFilter = item.type === 'cover';

            return matchesSearch && matchesFilter;
          });

          return { ...saga, items: matchingItems };
        }).filter(saga => saga.items.length > 0);
      }, [searchQuery, filter, checkedItems]);

      return (
        <div class="max-w-5xl mx-auto px-4 py-8">
          {/* Header */}
          <header class="mb-8 text-center bg-white dark:bg-zinc-900 rounded-2xl p-6 sm:p-8 shadow-sm border border-amber-200/60 dark:border-zinc-800">
            <div class="flex items-center justify-between mb-4">
              <span class="inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1 rounded-full bg-red-100 dark:bg-red-950/60 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-900/50">
                <Icon name="anchor" className="w-3.5 h-3.5" />
                Episode 1 to Present (1115+)
              </span>
              <div class="flex items-center gap-2">
                <button 
                  onClick={() => setShowShareModal(true)}
                  class="flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-lg bg-pirate-gold/20 text-pirate-navy dark:text-amber-300 hover:bg-pirate-gold/30 transition-all border border-amber-500/30">
                  <Icon name="share-2" className="w-3.5 h-3.5" />
                  {activeRoom ? `Room: ${activeRoom}` : 'Share Webapp Link'}
                </button>
                <button 
                  onClick={() => setDarkMode(!darkMode)}
                  class="p-2 rounded-lg bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-300 hover:bg-zinc-200 dark:hover:bg-zinc-700 transition">
                  <Icon name={darkMode ? 'sun' : 'moon'} className="w-4 h-4" />
                </button>
              </div>
            </div>

            <h1 class="font-header text-3xl sm:text-4xl font-extrabold text-pirate-red dark:text-red-500 tracking-tight mb-2">
              ONE PIECE ULTIMATE WATCH & READ ORDER
            </h1>
            <p class="text-sm text-zinc-600 dark:text-zinc-400 max-w-2xl mx-auto mb-6">
              Full community spoiler-free watching guide from East Blue to Egghead Arc. Track your personal viewing progress locally or create a shared room to watch with friends!
            </p>

            {/* Overall Progress Bar */}
            <div class="max-w-xl mx-auto bg-amber-50 dark:bg-zinc-800/80 p-4 rounded-xl border border-amber-200/50 dark:border-zinc-700">
              <div class="flex justify-between items-center text-xs font-bold mb-2">
                <span class="text-zinc-700 dark:text-zinc-300 flex items-center gap-1">
                  <Icon name="check-circle" className="w-4 h-4 text-emerald-500" /> Total Journey Progress
                </span>
                <span class="text-pirate-red dark:text-red-400">{completedCount} / {totalCount} Completed ({percentCompleted}%)</span>
              </div>
              <div class="w-full bg-zinc-200 dark:bg-zinc-700 h-3 rounded-full overflow-hidden">
                <div 
                  class="bg-gradient-to-r from-pirate-gold to-pirate-red h-full transition-all duration-300"
                  style={{ width: `${percentCompleted}%` }}>
                </div>
              </div>
            </div>
          </header>

          {/* Share Modal */}
          {showShareModal && (
            <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div class="bg-white dark:bg-zinc-900 border border-amber-200 dark:border-zinc-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
                <div class="flex justify-between items-center mb-4">
                  <h3 class="font-header text-lg font-bold text-pirate-navy dark:text-amber-400 flex items-center gap-2">
                    <Icon name="users" className="w-5 h-5 text-pirate-red" /> Watch Together & Share
                  </h3>
                  <button onClick={() => setShowShareModal(false)} class="text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>
                
                <p class="text-xs text-zinc-600 dark:text-zinc-400 mb-4">
                  By default, your progress is saved privately on your device. You can copy the main link to share with anyone for their personal use, or join a Shared Room to sync checkmarks in real-time with friends.
                </p>

                <div class="space-y-4">
                  <div class="p-3 bg-amber-50 dark:bg-zinc-800 rounded-xl border border-amber-200 dark:border-zinc-700">
                    <span class="text-xs font-semibold text-zinc-500 dark:text-zinc-400 block mb-1">Share Standard Webapp Link</span>
                    <button 
                      onClick={copyShareLink}
                      class="w-full py-2 px-3 bg-pirate-navy text-white text-xs font-bold rounded-lg hover:bg-pirate-navy/90 transition flex items-center justify-center gap-2">
                      <Icon name={copied ? "check" : "copy"} className="w-4 h-4" />
                      {copied ? "Link Copied to Clipboard!" : "Copy Webapp Link to Share"}
                    </button>
                  </div>

                  <div class="p-3 bg-zinc-50 dark:bg-zinc-800/50 rounded-xl border border-zinc-200 dark:border-zinc-700 space-y-2">
                    <span class="text-xs font-semibold text-zinc-500 dark:text-zinc-400 block">Shared Live Watch Room</span>
                    {activeRoom ? (
                      <div>
                        <p class="text-xs font-bold text-emerald-600 dark:text-emerald-400 mb-2">Connected to Room: {activeRoom}</p>
                        <button 
                          onClick={leaveRoom}
                          class="w-full py-2 px-3 bg-red-100 text-red-600 dark:bg-red-950/60 dark:text-red-400 text-xs font-bold rounded-lg hover:bg-red-200 transition">
                          Leave Shared Room (Switch back to Local)
                        </button>
                      </div>
                    ) : (
                      <div class="space-y-2">
                        <div class="flex gap-2">
                          <input 
                            type="text" 
                            placeholder="Enter Room Code..." 
                            value={roomId}
                            onChange={(e) => setRoomId(e.target.value)}
                            class="flex-1 text-xs px-3 py-2 rounded-lg bg-white dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 uppercase tracking-wider"
                          />
                          <button 
                            onClick={() => joinRoom(roomId)}
                            class="py-2 px-4 bg-emerald-600 text-white text-xs font-bold rounded-lg hover:bg-emerald-700 transition">
                            Join
                          </button>
                        </div>
                        <button 
                          onClick={createNewRoom}
                          class="w-full py-2 px-3 bg-amber-500/20 text-amber-700 dark:text-amber-300 border border-amber-500/30 text-xs font-bold rounded-lg hover:bg-amber-500/30 transition">
                          Generate New Shared Room Code
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Search and Filters Toolbar */}
          <div class="bg-white dark:bg-zinc-900 p-4 rounded-xl border border-amber-200/60 dark:border-zinc-800 shadow-sm mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
            {/* Search input */}
            <div class="relative w-full md:w-72">
              <input 
                type="text"
                placeholder="Search episodes, movies, cover stories..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                class="w-full pl-9 pr-4 py-2 text-xs rounded-lg bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 focus:outline-none focus:ring-2 focus:ring-pirate-red/50"
              />
              <div class="absolute left-3 top-2.5 text-zinc-400">
                <Icon name="search" className="w-4 h-4" />
              </div>
            </div>

            {/* Filter buttons */}
            <div class="flex flex-wrap gap-1.5 w-full md:w-auto justify-center">
              {[
                { key: 'all', label: 'All Items' },
                { key: 'remaining', label: 'Remaining' },
                { key: 'completed', label: 'Completed' },
                { key: 'movies', label: 'Movies & Specials' },
                { key: 'cover', label: 'Cover Stories' }
              ].map(f => (
                <button
                  key={f.key}
                  onClick={() => setFilter(f.key)}
                  class={`text-xs px-3 py-1.5 rounded-lg font-medium transition ${
                    filter === f.key 
                      ? 'bg-pirate-red text-white font-semibold shadow-sm' 
                      : 'bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400 hover:bg-zinc-200 dark:hover:bg-zinc-700'
                  }`}>
                  {f.label}
                </button>
              ))}
            </div>

            {/* Quick Actions */}
            <div class="flex items-center gap-2">
              <button 
                onClick={() => toggleAll(true)}
                class="text-xs px-2.5 py-1.5 rounded bg-emerald-50 text-emerald-600 dark:bg-emerald-950/40 dark:text-emerald-400 font-semibold hover:bg-emerald-100 transition">
                Check All
              </button>
              <button 
                onClick={() => toggleAll(false)}
                class="text-xs px-2.5 py-1.5 rounded bg-zinc-100 text-zinc-600 dark:bg-zinc-800 dark:text-zinc-400 font-semibold hover:bg-zinc-200 transition">
                Uncheck All
              </button>
            </div>
          </div>

          {/* Saga Sections */}
          <div class="space-y-6">
            {filteredSagas.map(saga => {
              const sagaCompletedCount = saga.items.filter(i => checkedItems[i.id]).length;
              const sagaTotalCount = saga.items.length;
              const isSagaDone = sagaCompletedCount === sagaTotalCount && sagaTotalCount > 0;

              return (
                <div 
                  key={saga.sagaId}
                  class={`bg-white dark:bg-zinc-900 rounded-xl p-5 border-t-4 ${saga.borderColor} border-x border-b border-amber-200/50 dark:border-zinc-800 shadow-sm transition`}>
                  
                  {/* Saga Header */}
                  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-3 mb-4 border-b border-zinc-100 dark:border-zinc-800 gap-2">
                    <div>
                      <h2 class="font-header text-lg font-bold text-pirate-navy dark:text-amber-400 flex items-center gap-2">
                        {saga.sagaTitle}
                        {isSagaDone && (
                          <span class="text-xs font-semibold px-2 py-0.5 rounded bg-emerald-100 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 flex items-center gap-1">
                            <Icon name="check-circle" className="w-3.5 h-3.5" /> Completed
                          </span>
                        )}
                      </h2>
                    </div>
                    <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400">
                      {sagaCompletedCount} / {sagaTotalCount} items
                    </span>
                  </div>

                  {/* Saga Items List */}
                  <div class="space-y-2.5">
                    {saga.items.map(item => {
                      const isChecked = !!checkedItems[item.id];
                      return (
                        <div 
                          key={item.id}
                          onClick={() => toggleItem(item.id)}
                          class={`group p-3.5 rounded-lg border transition cursor-pointer flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${
                            isChecked 
                              ? 'bg-amber-50/40 dark:bg-zinc-800/40 border-emerald-500/30 text-zinc-400 dark:text-zinc-500' 
                              : 'bg-white dark:bg-zinc-900/90 border-zinc-200/80 dark:border-zinc-800 hover:border-pirate-red/40 dark:hover:border-red-500/40'
                          }`}>
                          
                          <div class="flex items-start gap-3">
                            {/* Custom Checkbox */}
                            <div class={`mt-0.5 w-5 h-5 rounded border flex items-center justify-center transition flex-shrink-0 ${
                              isChecked 
                                ? 'bg-emerald-500 border-emerald-500 text-white' 
                                : 'border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-800 group-hover:border-pirate-red'
                            }`}>
                              {isChecked && <Icon name="check" className="w-3.5 h-3.5 stroke-[3]" />}
                            </div>

                            {/* Title & Tag */}
                            <div>
                              <div class="flex flex-wrap items-center gap-2 mb-1">
                                {getTypeTag(item.type, item.badgeTag)}
                                <span class={`text-sm font-semibold ${isChecked ? 'line-through text-zinc-400 dark:text-zinc-500' : 'text-zinc-800 dark:text-zinc-200'}`}>
                                  {item.title}
                                </span>
                              </div>

                              {/* Warning badges if any */}
                              {item.warning && (
                                <p class="text-xs text-red-600 dark:text-red-400 font-medium mt-1 flex items-center gap-1">
                                  <Icon name="alert-triangle" className="w-3.5 h-3.5 flex-shrink-0" />
                                  {item.warning}
                                </p>
                              )}

                              {/* Note if any */}
                              {item.note && (
                                <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-1 italic">
                                  Note: {item.note}
                                </p>
                              )}
                            </div>
                          </div>

                          {/* Link Button for Cover Stories */}
                          {item.link && (
                            <a 
                              href={item.link}
                              target="_blank"
                              rel="noopener noreferrer"
                              onClick={(e) => e.stopPropagation()}
                              class="inline-flex items-center gap-1 text-xs font-bold px-3 py-1.5 rounded bg-emerald-100 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300 hover:bg-emerald-200 transition self-start sm:self-center">
                              View Manga Pages <Icon name="external-link" className="w-3 h-3" />
                            </a>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Footer */}
          <footer class="mt-12 text-center text-xs text-zinc-500 dark:text-zinc-500 py-6 border-t border-amber-200/50 dark:border-zinc-800">
            <p>One Piece Ultimate Watch & Read Order • Designed for standard community viewing & manga cover story integration.</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
